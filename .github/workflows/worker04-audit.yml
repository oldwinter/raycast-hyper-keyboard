name: Worker 04 Audit

on:
  push:
    branches: ["worker04/official-lock-registry"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx vitest run --exclude tests/preview-next-step.test.mjs --pool=forks --maxWorkers=1
      - run: node --test tests/preview-next-step.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Verify lockfile registry validation despite known formatting blocker
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/raycast-lint.log
          lint_status=${PIPESTATUS[0]}
          set -e
          test "$lint_status" -eq 2
          grep -F "validate package-lock.json" /tmp/raycast-lint.log
          grep -F "src/data/load.ts" /tmp/raycast-lint.log
          grep -F "Code style issues found" /tmp/raycast-lint.log
          if grep -F "non-official npm registry" /tmp/raycast-lint.log; then
            exit 1
          fi
